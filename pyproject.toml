[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-invaders-arcade"
version = "1.0.0"
description = "Space Invaders en Python pur (notions du cours) jouable dans une salle d'arcade 3D"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Corentin" }, { name = "Maxim" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
